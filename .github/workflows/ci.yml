name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: run all tests
        run: |
          python -m unittest discover -s passgen
          python -m unittest discover -s todo-cli
          python -m unittest discover -s weather-cli
          python -m unittest discover -s disk-audit
          python -m unittest discover -s netcheck
          python -m unittest discover -s serveit
